x-recursos: &recursos
  cpus: 1.0
  mem_limit: 2g
  restart: unless-stopped
 
services:
  postgres:
    image: postgres:16
    <<: *recursos
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curriculo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curriculo}
      POSTGRES_DB: ${POSTGRES_DB:-curriculo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # executa os *.sql desta pasta na primeira inicialização (cria as tabelas)
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
 
  mongo:
    # 4.4 = última versão que roda em CPU SEM instrução AVX (5.0+ exige AVX).
    # Já tem $graphLookup, que usamos na cadeia de pré-requisitos.
    image: mongo:4.4
    <<: *recursos
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-curriculo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-curriculo}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-curriculo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # executa os *.js desta pasta na primeira inicialização (cria os índices)
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]   # 4.4 usa `mongo`, não `mongosh`
      interval: 5s
      timeout: 5s
      retries: 10
 
  neo4j:
    image: neo4j:5-community
    <<: *recursos
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-curriculo123}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # navegador: http://localhost:7474
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # driver
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
 
volumes:
  postgres_data:
  mongo_data:
  neo4j_data: